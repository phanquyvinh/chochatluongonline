<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng — chochatluongonline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <div class="logo-mark">CCL</div>
        <div class="logo-text">chochatluong<span>online</span></div>
      </a>
      <div class="header-actions" id="userNav"></div>
    </div>
  </header>

  <main class="container" style="padding:28px 20px 48px">
    <h1 style="font-size:1.3rem;margin-bottom:20px">Đơn hàng của bạn</h1>
    <div id="orderList"></div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const s = requireAuth(['buyer', 'admin']);
      if (!s) return;
      renderUserNav();
      const orders = CCLStore.getOrders().filter((o) => o.buyerEmail === s.email || s.role === 'admin');
      const el = document.getElementById('orderList');
      if (!orders.length) {
        el.innerHTML = '<div class="panel"><p style="color:var(--text-muted)">Chưa có đơn hàng</p></div>';
        return;
      }
      const statusMap = {
        held: '<span class="status-pill status-held">Tạm giữ</span>',
        shipping: '<span class="status-pill status-pending">Đang giao</span>',
        released: '<span class="status-pill status-released">Đã giải ngân</span>',
        return_requested: '<span class="status-pill status-pending">Yêu cầu hoàn</span>',
        returned: '<span class="status-pill status-done">Đã hoàn</span>',
      };
      el.innerHTML = orders.map((o) => `
        <div class="panel">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
            <strong>${o.id}</strong>
            ${statusMap[o.status] || o.status}
          </div>
          <div style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:8px">
            ${new Date(o.createdAt).toLocaleString('vi-VN')} · ${o.bank || ''}
          </div>
          <ul style="font-size:0.9rem;margin-bottom:12px">
            ${(o.cart || []).map((i) => `<li>${i.name} × ${i.qty || 1} — ${formatVND(i.price * (i.qty || 1))}</li>`).join('')}
          </ul>
          <div style="font-weight:700;margin-bottom:12px">Tổng: ${formatVND(o.totals?.grandTotal || 0)}</div>
          ${o.status === 'held' || o.status === 'shipping' ? `
            <button class="btn btn-outline btn-sm" onclick="askReturn('${o.id}')">Yêu cầu hoàn hàng</button>
          ` : ''}
          ${o.returnReason ? `<p style="margin-top:8px;font-size:0.85rem;color:var(--warning)">Lý do hoàn: ${o.returnReason}</p>` : ''}
        </div>
      `).join('');
    });

    function askReturn(orderId) {
      const reason = prompt('Lý do hoàn hàng:');
      if (!reason) return;
      const s = getSession();
      const res = CCLStore.requestReturn(orderId, reason, s.email);
      if (res.error) toast(res.error, 'error');
      else { toast('Đã gửi yêu cầu hoàn', 'success'); location.reload(); }
    }
  </script>
</body>
</html>
