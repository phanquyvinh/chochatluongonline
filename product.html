<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm — chochatluongonline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .product-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 28px; margin-top: 24px; }
    @media (max-width: 768px) { .product-layout { grid-template-columns: 1fr; } }
    .product-gallery {
      background: var(--bg-muted); border-radius: var(--radius-lg); height: 320px;
      display: flex; align-items: center; justify-content: center; font-size: 5rem;
      overflow: hidden; border: 1px solid var(--border); position: relative;
    }
    .product-gallery img, .product-gallery video { width: 100%; height: 100%; object-fit: cover; }
    .gallery-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .gallery-thumbs .thumb {
      width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 2px solid transparent;
      cursor: pointer; background: var(--bg-muted);
    }
    .gallery-thumbs .thumb.active { border-color: var(--primary); }
    .gallery-thumbs .thumb img, .gallery-thumbs .thumb video { width: 100%; height: 100%; object-fit: cover; }
    .review-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .review-item:last-child { border-bottom: none; }
    .review-media { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .review-media img, .review-media video {
      width: 88px; height: 88px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border);
    }
    .star-input { display: flex; gap: 4px; font-size: 1.4rem; cursor: pointer; }
    .star-input span { color: var(--border-strong); }
    .star-input span.on { color: #f59e0b; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <div class="logo-mark">CCL</div>
        <div class="logo-text">chochatluong<span>online</span></div>
      </a>
      <div class="header-actions" id="userNav"></div>
    </div>
  </header>

  <main class="container" style="padding:24px 20px 48px" id="main">
    <p style="color:var(--text-muted)">Đang tải...</p>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/privacy.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentRating = 5;
    let reviewImages = [];
    let reviewVideos = [];
    const REVIEW_MAX_IMG = 6;
    const REVIEW_MAX_VID = 2;
    const params = new URLSearchParams(location.search);
    const productId = params.get('id');
    let galleryItems = [];
    let galleryIndex = 0;

    function setStar(n) {
      currentRating = n;
      document.querySelectorAll('#starInput span').forEach((el, i) => {
        el.classList.toggle('on', i < n);
      });
    }

    function showGallery(i) {
      galleryIndex = i;
      const main = document.getElementById('galleryMain');
      if (!main || !galleryItems[i]) return;
      const item = galleryItems[i];
      if (item.type === 'video') {
        main.innerHTML = `<video src="${item.src}" controls playsinline style="width:100%;height:100%;object-fit:cover"></video>`;
      } else {
        main.innerHTML = `<img src="${item.src}" alt="">`;
      }
      document.querySelectorAll('.gallery-thumbs .thumb').forEach((el, idx) => {
        el.classList.toggle('active', idx === i);
      });
    }

    function compressImageFile(file, maxW, quality) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('Không phải ảnh'));
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          reject(new Error('Ảnh tối đa 8MB'));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const limit = maxW || 1000;
            if (w > limit) { h = Math.round(h * limit / w); w = limit; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality || 0.7));
          };
          img.onerror = () => reject(new Error('Không đọc được ảnh'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('Lỗi đọc file'));
        reader.readAsDataURL(file);
      });
    }

    function readVideoFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('video/')) {
          reject(new Error('Không phải video'));
          return;
        }
        if (file.size > 40 * 1024 * 1024) {
          reject(new Error('Video tối đa 40MB'));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Lỗi đọc video'));
        reader.readAsDataURL(file);
      });
    }

    function renderReviewMediaPreview() {
      const box = document.getElementById('reviewMediaPreview');
      if (!box) return;
      const parts = [];
      reviewImages.forEach((src, i) => {
        parts.push(`<div class="media-thumb"><img src="${src}" alt=""><button type="button" class="media-remove" onclick="removeReviewImage(${i})">×</button></div>`);
      });
      reviewVideos.forEach((src, i) => {
        parts.push(`<div class="media-thumb media-thumb-video"><video src="${src}" muted playsinline></video><button type="button" class="media-remove" onclick="removeReviewVideo(${i})">×</button></div>`);
      });
      box.innerHTML = parts.length ? parts.join('') : '<span style="color:var(--text-muted);font-size:0.85rem">Chưa có ảnh/video</span>';
      const hint = document.getElementById('reviewMediaCount');
      if (hint) hint.textContent = `${reviewImages.length}/${REVIEW_MAX_IMG} ảnh · ${reviewVideos.length}/${REVIEW_MAX_VID} video`;
    }

    function removeReviewImage(i) {
      reviewImages.splice(i, 1);
      renderReviewMediaPreview();
    }
    function removeReviewVideo(i) {
      reviewVideos.splice(i, 1);
      renderReviewMediaPreview();
    }

    function bindReviewMedia() {
      const onImg = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        for (const file of files) {
          if (reviewImages.length >= REVIEW_MAX_IMG) { toast('Tối đa ' + REVIEW_MAX_IMG + ' ảnh', 'error'); break; }
          try {
            const data = await compressImageFile(file);
            reviewImages.push(data);
            renderReviewMediaPreview();
          } catch (err) { toast(err.message || 'Lỗi ảnh', 'error'); }
        }
      };
      const onVid = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        for (const file of files) {
          if (reviewVideos.length >= REVIEW_MAX_VID) { toast('Tối đa ' + REVIEW_MAX_VID + ' video', 'error'); break; }
          try {
            const data = await readVideoFile(file);
            reviewVideos.push(data);
            renderReviewMediaPreview();
          } catch (err) { toast(err.message || 'Lỗi video', 'error'); }
        }
      };
      document.getElementById('rvImageFile')?.addEventListener('change', onImg);
      document.getElementById('rvImageCamera')?.addEventListener('change', onImg);
      document.getElementById('rvVideoFile')?.addEventListener('change', onVid);
      document.getElementById('rvVideoCamera')?.addEventListener('change', onVid);
    }

    function render() {
      renderUserNav();
      const p = CCLStore.getProductById(productId);
      if (!p) {
        document.getElementById('main').innerHTML = '<p>Không tìm thấy sản phẩm. <a href="/">Về trang chủ</a></p>';
        return;
      }
      const reviews = CCLStore.getReviews((r) => r.productId === p.id);
      const session = getSession();
      const imgs = Array.isArray(p.images) ? p.images.filter(Boolean) : [];
      const vids = Array.isArray(p.videos) ? p.videos.filter(Boolean) : [];
      galleryItems = [
        ...imgs.map((src) => ({ type: 'image', src })),
        ...vids.map((src) => ({ type: 'video', src })),
      ];
      const mainMedia = galleryItems.length
        ? (galleryItems[0].type === 'video'
            ? `<video src="${galleryItems[0].src}" controls playsinline style="width:100%;height:100%;object-fit:cover"></video>`
            : `<img src="${galleryItems[0].src}" alt="">`)
        : (p.emoji || '📦');
      const thumbs = galleryItems.length > 1
        ? `<div class="gallery-thumbs">${galleryItems.map((it, i) =>
            `<div class="thumb ${i === 0 ? 'active' : ''}" onclick="showGallery(${i})">
              ${it.type === 'video' ? `<video src="${it.src}" muted playsinline></video>` : `<img src="${it.src}" alt="">`}
            </div>`
          ).join('')}</div>`
        : '';

      document.title = p.name + ' — chochatluongonline';
      document.getElementById('main').innerHTML = `
        <div class="product-layout">
          <div>
            <div class="product-gallery" id="galleryMain">${mainMedia}</div>
            ${thumbs}
          </div>
          <div>
            <a href="/shop.html?id=${p.shopId}" style="color:var(--primary);font-size:0.9rem;font-weight:600">🏪 ${p.shopName}</a>
            <h1 style="font-size:1.5rem;margin:8px 0 12px;letter-spacing:-0.3px">${p.name}</h1>
            <div style="color:var(--text-muted);margin-bottom:12px">${stars(p.rating)} ${p.rating || 0} · ${reviews.length} đánh giá · Đã bán ${p.sold || 0}</div>
            <div class="price" style="font-size:1.6rem;margin-bottom:16px">${formatVND(p.price)}</div>
            <button class="btn btn-primary" onclick="addToCart('${p.id}')" style="min-width:160px">Thêm vào giỏ</button>
          </div>
        </div>

        <div class="panel" style="margin-top:28px">
          <h2 class="panel-title">Mô tả</h2>
          <p style="color:var(--text-secondary);white-space:pre-wrap">${p.description || '—'}</p>
        </div>
        <div class="panel">
          <h2 class="panel-title">Hướng dẫn</h2>
          <p style="color:var(--text-secondary);white-space:pre-wrap">${p.guide || '—'}</p>
        </div>

        <div class="panel">
          <h2 class="panel-title">Đánh giá (${reviews.length})</h2>
          <div id="reviewList">
            ${reviews.length ? reviews.map((r) => {
              const rImgs = Array.isArray(r.images) ? r.images : [];
              const rVids = Array.isArray(r.videos) ? r.videos : [];
              const mediaHtml = (rImgs.length || rVids.length)
                ? `<div class="review-media">${rImgs.map((s) => `<img src="${s}" alt="">`).join('')}${rVids.map((s) => `<video src="${s}" controls playsinline></video>`).join('')}</div>`
                : '';
              return `
              <div class="review-item" data-id="${r.id}">
                <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
                  <strong>${r.userName || 'Người mua'}</strong>
                  <span style="color:#f59e0b">${stars(r.rating)}</span>
                </div>
                <p style="margin-top:6px;color:var(--text-secondary)">${r.content || ''}</p>
                ${mediaHtml}
                <div style="margin-top:6px;font-size:0.8rem;color:var(--text-muted)">${new Date(r.createdAt).toLocaleString('vi-VN')}
                  ${session && (session.email === r.userEmail || session.role === 'admin')
                    ? ` · <button class="btn btn-ghost btn-sm" onclick="removeReview('${r.id}')">Xóa</button>` : ''}
                </div>
              </div>`;
            }).join('') : '<p style="color:var(--text-muted)">Chưa có đánh giá</p>'}
          </div>

          ${session && session.role !== 'seller' ? `
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
            <h3 style="font-size:0.95rem;margin-bottom:10px">Viết đánh giá</h3>
            <div class="star-input" id="starInput">
              ${[1,2,3,4,5].map((n) => `<span class="on" onmouseenter="setStar(${n})" onclick="setStar(${n})">★</span>`).join('')}
            </div>
            <textarea id="reviewContent" rows="3" placeholder="Nội dung đánh giá..."
              style="width:100%;margin-top:10px;padding:10px;border:1.5px solid var(--border);border-radius:8px;resize:vertical"></textarea>
            <div class="img-upload-box" style="margin-top:12px">
              <div class="media-preview-grid" id="reviewMediaPreview"></div>
              <div class="img-actions" style="margin-top:8px">
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('rvImageFile').click()">Chọn ảnh</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('rvImageCamera').click()">Chụp ảnh</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('rvVideoFile').click()">Chọn video</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('rvVideoCamera').click()">Quay video</button>
              </div>
              <input type="file" id="rvImageFile" accept="image/*" multiple hidden>
              <input type="file" id="rvImageCamera" accept="image/*" capture="environment" hidden>
              <input type="file" id="rvVideoFile" accept="video/*" hidden>
              <input type="file" id="rvVideoCamera" accept="video/*" capture="environment" hidden>
              <p class="media-hint" id="reviewMediaCount">0/6 ảnh · 0/2 video</p>
            </div>
            <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="submitReview()">Gửi đánh giá</button>
          </div>` : session ? '' : '<p style="margin-top:12px;color:var(--text-muted)"><a href="/login.html" style="color:var(--primary)">Đăng nhập</a> để đánh giá</p>'}
        </div>
      `;
      reviewImages = [];
      reviewVideos = [];
      renderReviewMediaPreview();
      bindReviewMedia();
    }

    function submitReview() {
      const content = document.getElementById('reviewContent').value;
      const p = CCLStore.getProductById(productId);
      const res = CCLStore.addReview({
        productId: p.id, shopId: p.shopId,
        rating: currentRating, content,
        images: reviewImages.slice(0, REVIEW_MAX_IMG),
        videos: reviewVideos.slice(0, REVIEW_MAX_VID),
      });
      if (res.error) { toast(res.error, 'error'); return; }
      toast('Đã gửi đánh giá', 'success');
      reviewImages = [];
      reviewVideos = [];
      render();
    }

    function removeReview(id) {
      const s = getSession();
      if (!s) return;
      const res = CCLStore.deleteReview(id, s);
      if (res.error) { toast(res.error, 'error'); return; }
      toast('Đã xóa đánh giá', 'info');
      render();
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
