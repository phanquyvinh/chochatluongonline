<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị — chochatluongonline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dash-layout">
    <header class="dash-header">
      <div class="container dash-header-inner">
        <div class="dash-title">
          <a href="/" class="logo" style="margin-right:8px"><div class="logo-mark">CCL</div></a>
          Quản trị
          <span class="dash-badge badge-admin">Admin</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span id="adminName" style="font-size:0.9rem;color:var(--text-secondary)"></span>
          <a href="/" class="btn btn-ghost btn-sm">Trang chủ</a>
          <button class="btn btn-outline btn-sm" onclick="logout()">Thoát</button>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <div class="container">
        <div class="panel">
          <h2 class="panel-title">Tài chính</h2>
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">GMV (mẫu)</div><div class="stat-value" id="grossSales">—</div></div>
            <div class="stat-card highlight"><div class="stat-label">Phí sàn</div><div class="stat-value" id="platformRev">—</div></div>
            <div class="stat-card"><div class="stat-label">Thuế ước tính</div><div class="stat-value" id="stateTax">—</div></div>
            <div class="stat-card"><div class="stat-label">Ròng</div><div class="stat-value" id="netProfit">—</div></div>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title">Cấu hình</h2>
          <div class="form-row">
            <div class="form-field"><label>Phí sàn (%)</label><input type="number" id="cfg_fee" min="0" max="30" step="0.1"></div>
            <div class="form-field"><label>Thuế DN (%)</label><input type="number" id="cfg_tax" min="0" max="50" step="0.5"></div>
            <div class="form-field"><label>Ship mặc định (đ)</label><input type="number" id="cfg_ship" min="0" step="1000"></div>
            <div class="form-field"><label>Ngày giữ escrow</label><input type="number" id="cfg_escrow" min="0" max="30"></div>
            <div class="form-field"><label>Ngày cửa sổ hoàn</label><input type="number" id="cfg_return" min="0" max="30"></div>
          </div>
          <button class="btn btn-primary" onclick="saveCfg()">Lưu</button>
        </div>

        <div class="panel">
          <h2 class="panel-title">Yêu cầu hoàn hàng</h2>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Đơn</th><th>Email</th><th>Lý do</th><th>Trạng thái</th></tr></thead>
              <tbody id="returnsBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title">Chặn tài khoản</h2>
          <div class="form-row">
            <div class="form-field" style="flex:2"><label>Email</label><input type="email" id="blockEmail" placeholder="email@..."></div>
            <div class="form-field"><label>Loại</label>
              <select id="blockType">
                <option value="fraud_seller">Seller gian lận</option>
                <option value="bomb_buyer">Bom hàng</option>
                <option value="other">Khác</option>
              </select>
            </div>
            <div class="form-field" style="flex:2"><label>Lý do</label><input type="text" id="blockReason"></div>
          </div>
          <button class="btn btn-accent" onclick="doBlock()">Chặn</button>
          <div class="table-wrap" style="margin-top:16px">
            <table class="data-table">
              <thead><tr><th>Email</th><th>Loại</th><th>Lý do</th><th></th></tr></thead>
              <tbody id="blocksBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const s = requireAuth(['admin']);
      if (!s) return;
      document.getElementById('adminName').textContent = s.name || s.email;
      const c = CCLConfig.loadPlatformConfig();
      document.getElementById('cfg_fee').value = c.platformFeeRate * 100;
      document.getElementById('cfg_tax').value = c.corporateTaxRate * 100;
      document.getElementById('cfg_ship').value = c.defaultShipFeePerShop;
      document.getElementById('cfg_escrow').value = c.escrowHoldDays;
      document.getElementById('cfg_return').value = c.returnWindowDays || 3;
      refreshStats();
      renderReturns();
      renderBlocks();
    });

    function refreshStats() {
      const c = CCLConfig.loadPlatformConfig();
      const gmv = 85000000;
      const rev = Math.round(gmv * c.platformFeeRate);
      const tax = Math.round(rev * c.corporateTaxRate);
      document.getElementById('grossSales').textContent = formatVND(gmv);
      document.getElementById('platformRev').textContent = formatVND(rev);
      document.getElementById('stateTax').textContent = formatVND(tax);
      document.getElementById('netProfit').textContent = formatVND(rev - tax);
    }

    function saveCfg() {
      CCLConfig.savePlatformConfig({
        platformFeeRate: Number(document.getElementById('cfg_fee').value) / 100,
        corporateTaxRate: Number(document.getElementById('cfg_tax').value) / 100,
        defaultShipFeePerShop: document.getElementById('cfg_ship').value,
        escrowHoldDays: document.getElementById('cfg_escrow').value,
        returnWindowDays: document.getElementById('cfg_return').value,
      }, getSession()?.name || 'admin');
      toast('Đã lưu', 'success');
      refreshStats();
    }

    function renderReturns() {
      const orders = CCLStore.getOrders().filter((o) => o.status === 'return_requested' || o.status === 'returned');
      const body = document.getElementById('returnsBody');
      if (!orders.length) {
        body.innerHTML = '<tr><td colspan="4" style="color:var(--text-muted);text-align:center">Không có</td></tr>';
        return;
      }
      body.innerHTML = orders.map((o) => `
        <tr>
          <td>${o.id}</td>
          <td>${o.buyerEmail || ''}</td>
          <td>${o.returnReason || ''}</td>
          <td>${o.status}</td>
        </tr>
      `).join('');
    }

    function doBlock() {
      const email = document.getElementById('blockEmail').value.trim();
      const reason = document.getElementById('blockReason').value.trim();
      const type = document.getElementById('blockType').value;
      if (!email || !reason) { toast('Nhập email và lý do', 'error'); return; }
      const s = getSession();
      // ensure user record exists for block list
      if (!CCLStore.findUserByEmail(email)) {
        CCLStore.createUser({ email, password: '!', name: email, role: 'buyer' });
        CCLStore.updateUser(email, { verified: true });
      }
      CCLStore.blockUser(email, reason, type, s.email);
      toast('Đã chặn', 'success');
      renderBlocks();
    }

    function renderBlocks() {
      const blocks = CCLStore.getBlocks();
      const body = document.getElementById('blocksBody');
      if (!blocks.length) {
        body.innerHTML = '<tr><td colspan="4" style="color:var(--text-muted);text-align:center">Không có</td></tr>';
        return;
      }
      body.innerHTML = blocks.map((b) => `
        <tr>
          <td>${b.email}</td>
          <td>${b.type}</td>
          <td>${b.reason}</td>
          <td><button class="btn btn-ghost btn-sm" onclick="unblock('${b.email}')">Gỡ</button></td>
        </tr>
      `).join('');
    }

    function unblock(email) {
      CCLStore.unblockUser(email);
      toast('Đã gỡ chặn', 'info');
      renderBlocks();
    }
  </script>
</body>
</html>
