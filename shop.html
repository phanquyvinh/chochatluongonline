<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gian hàng — chochatluongonline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <div class="logo-mark">CCL</div>
        <div class="logo-text">chochatluong<span>online</span></div>
      </a>
      <div class="header-actions" id="userNav"></div>
    </div>
  </header>

  <main class="container" style="padding:24px 20px 48px">
    <div class="panel" id="shopHeader">
      <p style="color:var(--text-muted)">Đang tải...</p>
    </div>
    <section class="section">
      <div class="section-header">
        <h2 class="section-title"><span class="icon">📦</span> Sản phẩm & dịch vụ</h2>
      </div>
      <div class="grid" id="shopGrid"></div>
    </section>
    <section class="section">
      <div class="panel">
        <h2 class="panel-title">Đánh giá gian hàng</h2>
        <div id="shopReviews"></div>
      </div>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/privacy.js"></script>
  <script src="js/app.js"></script>
  <script>
    const shopId = new URLSearchParams(location.search).get('id');
    document.addEventListener('DOMContentLoaded', () => {
      renderUserNav();
      const products = CCLStore.getProductsByShop(shopId);
      const rating = CCLStore.getShopRating(shopId);
      const settings = CCLConfig.loadShopSettings(shopId);
      const name = products[0]?.shopName || settings.shopName || shopId;
      document.title = name + ' — chochatluongonline';

      document.getElementById('shopHeader').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
          <div>
            <h1 style="font-size:1.4rem;margin-bottom:6px">🏪 ${name}</h1>
            <div style="color:var(--text-muted)">${stars(rating.avg)} ${rating.avg} · ${rating.count} đánh giá</div>
            <div style="margin-top:8px;font-size:0.9rem;color:var(--text-secondary)">
              Ship từ ${formatVND(settings.shipFeeProduct || 0)}
              ${settings.freeShipThreshold ? ' · Miễn ship từ ' + formatVND(settings.freeShipThreshold) : ''}
              ${settings.acceptOrders === false ? ' · <span style="color:var(--danger)">Tạm ngưng nhận đơn</span>' : ''}
            </div>
          </div>
        </div>`;

      document.getElementById('shopGrid').innerHTML = products.length
        ? products.map(productCard).join('')
        : '<p class="empty-msg">Chưa có sản phẩm</p>';

      const revs = CCLStore.getReviews((r) => r.shopId === shopId);
      const session = getSession();
      document.getElementById('shopReviews').innerHTML = revs.length ? revs.map((r) => `
        <div class="review-item" style="padding:12px 0;border-bottom:1px solid var(--border)">
          <strong>${r.userName}</strong> <span style="color:#f59e0b">${stars(r.rating)}</span>
          <p style="color:var(--text-secondary);margin-top:4px">${r.content || ''}</p>
          <div style="font-size:0.8rem;color:var(--text-muted)">${new Date(r.createdAt).toLocaleString('vi-VN')}
            ${session && (session.email === r.userEmail || session.role === 'admin')
              ? ` · <button class="btn btn-ghost btn-sm" onclick="delRev('${r.id}')">Xóa</button>` : ''}
          </div>
        </div>
      `).join('') : '<p style="color:var(--text-muted)">Chưa có đánh giá</p>';
    });

    function delRev(id) {
      const s = getSession();
      const res = CCLStore.deleteReview(id, s);
      if (res.error) toast(res.error, 'error');
      else location.reload();
    }
  </script>
</body>
</html>
