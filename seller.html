<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gian hàng — chochatluongonline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dash-layout">
    <header class="dash-header">
      <div class="container dash-header-inner">
        <div class="dash-title">
          <a href="/" class="logo" style="margin-right:8px"><div class="logo-mark">CCL</div></a>
          Gian hàng
          <span class="dash-badge badge-seller">Seller</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span id="sellerName" style="font-size:0.9rem;color:var(--text-secondary)"></span>
          <a href="/" class="btn btn-ghost btn-sm">Trang chủ</a>
          <button class="btn btn-outline btn-sm" onclick="logout()">Thoát</button>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <div class="container">
        <div class="panel">
          <h2 class="panel-title">Trạng thái</h2>
          <label style="display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer">
            <input type="checkbox" id="acceptOrders" onchange="toggleAccept()"> Đang nhận đơn
          </label>
        </div>

        <div class="panel">
          <h2 class="panel-title">Phí vận chuyển</h2>
          <div class="form-row">
            <div class="form-field"><label>Ship sản phẩm (đ)</label><input type="text" id="shipFeeProduct" inputmode="numeric" placeholder="0" autocomplete="off"></div>
            <div class="form-field"><label>Miễn ship từ (đ)</label><input type="text" id="freeShipThreshold" inputmode="numeric" placeholder="0" autocomplete="off"></div>
            <div class="form-field"><label>Phụ phí dịch vụ (đ)</label><input type="text" id="serviceCallOutFee" inputmode="numeric" placeholder="0" autocomplete="off"></div>
            <div class="form-field"><label>Đơn tối thiểu (đ)</label><input type="text" id="minOrderAmount" inputmode="numeric" placeholder="0" autocomplete="off"></div>
          </div>
          <button class="btn btn-primary" onclick="savePricing()">Lưu</button>
        </div>

        <div class="panel">
          <h2 class="panel-title">Đăng sản phẩm / dịch vụ</h2>
          <div class="form-row">
            <div class="form-field" style="flex:2"><label>Tên</label><input type="text" id="pName" placeholder="Tên sản phẩm hoặc dịch vụ"></div>
            <div class="form-field"><label>Loại</label>
              <select id="pType"><option value="product">Sản phẩm</option><option value="service">Dịch vụ</option></select>
            </div>
            <div class="form-field"><label data-i18n="price">Giá (đ)</label><input type="text" id="pPrice" inputmode="numeric" placeholder="0" autocomplete="off"></div>
          </div>
          <div class="form-row">
            <div class="form-field"><label>Danh mục</label>
              <select id="pCat">
                <option value="linh-kien">Linh kiện</option>
                <option value="sua-chua">Sửa chữa</option>
                <option value="lap-dat">Lắp đặt</option>
                <option value="khac">Khác</option>
              </select>
            </div>
            <div class="form-field"><label>Emoji</label><input type="text" id="pEmoji" placeholder="📦" maxlength="4"></div>
          </div>
          <div class="form-field" style="margin-bottom:12px">
            <label>Ảnh sản phẩm (tối đa 10) — link / máy / camera</label>
            <div class="img-upload-box">
              <div class="media-preview-grid" id="pImagesPreview"></div>
              <div class="img-actions" style="margin-top:8px">
                <input type="url" id="pImageUrl" placeholder="https://... (thêm link ảnh)" style="flex:1;min-width:140px">
                <button type="button" class="btn btn-outline btn-sm" onclick="addImageFromUrl()">Thêm link</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('pImageFile').click()">Chọn ảnh</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('pImageCamera').click()">Chụp ảnh</button>
              </div>
              <input type="file" id="pImageFile" accept="image/*" multiple hidden>
              <input type="file" id="pImageCamera" accept="image/*" capture="environment" hidden>
              <p class="media-hint" id="pImagesCount">0/10 ảnh</p>
            </div>
          </div>
          <div class="form-field" style="margin-bottom:12px">
            <label>Video sản phẩm (tối đa 2) — máy / camera</label>
            <div class="img-upload-box">
              <div class="media-preview-grid" id="pVideosPreview"></div>
              <div class="img-actions" style="margin-top:8px">
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('pVideoFile').click()">Chọn video</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('pVideoCamera').click()">Quay video</button>
              </div>
              <input type="file" id="pVideoFile" accept="video/*" multiple hidden>
              <input type="file" id="pVideoCamera" accept="video/*" capture="environment" hidden>
              <p class="media-hint" id="pVideosCount">0/2 video</p>
            </div>
          </div>
          <div class="form-field" style="margin-bottom:12px">
            <label data-i18n="description">Mô tả</label>
            <textarea id="pDesc" rows="3" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px"></textarea>
          </div>
          <div class="form-field" style="margin-bottom:12px">
            <label>Hướng dẫn chi tiết</label>
            <textarea id="pGuide" rows="3" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px"></textarea>
          </div>
          <input type="hidden" id="pEditId">
          <button class="btn btn-primary" onclick="saveProductForm()">Lưu sản phẩm</button>
          <button class="btn btn-ghost" onclick="resetProductForm()">Hủy</button>
        </div>

        <div class="panel">
          <h2 class="panel-title">Sản phẩm & dịch vụ đang bán</h2>
          <div class="seller-products-grid" id="myProductsGrid"></div>
          <div class="table-wrap" style="margin-top:16px">
            <table class="data-table">
              <thead><tr><th>Tên</th><th>Loại</th><th>Giá</th><th></th></tr></thead>
              <tbody id="myProducts"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title">Liên hệ gian hàng</h2>
          <div class="form-row">
            <div class="form-field"><label>Số điện thoại</label><input type="tel" id="sellerPhone" placeholder="09x..."></div>
            <div class="form-field" style="flex:2"><label>Địa chỉ</label><input type="text" id="sellerAddress" placeholder="Địa chỉ lấy hàng / cửa hàng"></div>
          </div>
          <button class="btn btn-primary" onclick="saveSellerContact()">Lưu liên hệ</button>
        </div>

        <div class="panel">
          <h2 class="panel-title">Tài khoản nhận tiền</h2>
          <div class="form-row">
            <div class="form-field"><label>Ngân hàng</label><input type="text" id="bankName"></div>
            <div class="form-field"><label>Số TK</label><input type="text" id="bankAcc"></div>
            <div class="form-field"><label>Chủ TK</label><input type="text" id="bankHolder"></div>
          </div>
          <button class="btn btn-primary" onclick="saveBank()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    let session = null;
    let productImages = []; // max 10
    let productVideos = []; // max 2

    const MAX_IMAGES = 10;
    const MAX_VIDEOS = 2;

    function compressImageFile(file, maxW, quality) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('Không phải ảnh'));
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          reject(new Error('Ảnh tối đa 8MB'));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const limit = maxW || 1200;
            if (w > limit) { h = Math.round(h * limit / w); w = limit; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality || 0.72));
          };
          img.onerror = () => reject(new Error('Không đọc được ảnh'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('Lỗi đọc file'));
        reader.readAsDataURL(file);
      });
    }

    function readVideoFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('video/')) {
          reject(new Error('Không phải video'));
          return;
        }
        if (file.size > 40 * 1024 * 1024) {
          reject(new Error('Video tối đa 40MB'));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Lỗi đọc video'));
        reader.readAsDataURL(file);
      });
    }

    function renderImagesPreview() {
      const box = document.getElementById('pImagesPreview');
      const count = document.getElementById('pImagesCount');
      if (count) count.textContent = productImages.length + '/' + MAX_IMAGES + ' ảnh';
      if (!box) return;
      if (!productImages.length) {
        box.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem">Chưa có ảnh</span>';
        return;
      }
      box.innerHTML = productImages.map((src, i) => `
        <div class="media-thumb">
          <img src="${src}" alt="Ảnh ${i + 1}" onerror="this.parentElement.innerHTML='Lỗi ảnh'">
          <button type="button" class="media-remove" onclick="removeProductImage(${i})" title="Xóa">×</button>
        </div>
      `).join('');
    }

    function renderVideosPreview() {
      const box = document.getElementById('pVideosPreview');
      const count = document.getElementById('pVideosCount');
      if (count) count.textContent = productVideos.length + '/' + MAX_VIDEOS + ' video';
      if (!box) return;
      if (!productVideos.length) {
        box.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem">Chưa có video</span>';
        return;
      }
      box.innerHTML = productVideos.map((src, i) => `
        <div class="media-thumb media-thumb-video">
          <video src="${src}" muted playsinline></video>
          <button type="button" class="media-remove" onclick="removeProductVideo(${i})" title="Xóa">×</button>
        </div>
      `).join('');
    }

    function removeProductImage(i) {
      productImages.splice(i, 1);
      renderImagesPreview();
    }
    function removeProductVideo(i) {
      productVideos.splice(i, 1);
      renderVideosPreview();
    }

    function addImageFromUrl() {
      const el = document.getElementById('pImageUrl');
      const v = (el && el.value || '').trim();
      if (!v) { toast('Nhập link ảnh', 'error'); return; }
      if (productImages.length >= MAX_IMAGES) { toast('Tối đa ' + MAX_IMAGES + ' ảnh', 'error'); return; }
      productImages.push(v);
      if (el) el.value = '';
      renderImagesPreview();
      toast('Đã thêm ảnh', 'success');
    }

    function bindMediaInputs() {
      const onImageFiles = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length) return;
        for (const file of files) {
          if (productImages.length >= MAX_IMAGES) {
            toast('Tối đa ' + MAX_IMAGES + ' ảnh', 'error');
            break;
          }
          try {
            toast('Đang xử lý ảnh...', 'info');
            const data = await compressImageFile(file);
            productImages.push(data);
            renderImagesPreview();
          } catch (err) {
            toast(err.message || 'Lỗi ảnh', 'error');
          }
        }
        if (files.length) toast('Đã thêm ảnh', 'success');
      };
      document.getElementById('pImageFile')?.addEventListener('change', onImageFiles);
      document.getElementById('pImageCamera')?.addEventListener('change', onImageFiles);

      const onVideoFiles = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length) return;
        for (const file of files) {
          if (productVideos.length >= MAX_VIDEOS) {
            toast('Tối đa ' + MAX_VIDEOS + ' video', 'error');
            break;
          }
          try {
            toast('Đang xử lý video...', 'info');
            const data = await readVideoFile(file);
            productVideos.push(data);
            renderVideosPreview();
          } catch (err) {
            toast(err.message || 'Lỗi video', 'error');
          }
        }
        if (files.length) toast('Đã thêm video', 'success');
      };
      document.getElementById('pVideoFile')?.addEventListener('change', onVideoFiles);
      document.getElementById('pVideoCamera')?.addEventListener('change', onVideoFiles);
    }


    function init() {
      session = requireAuth(['seller', 'admin']);
      if (!session) return;
      document.getElementById('sellerName').textContent = session.shopName || session.name;
      if (!session.shopId && session.role === 'admin') session.shopId = 's101';
      const s = CCLConfig.loadShopSettings(session.shopId);
      document.getElementById('acceptOrders').checked = s.acceptOrders !== false;
      const moneyIds = ['shipFeeProduct', 'freeShipThreshold', 'serviceCallOutFee', 'minOrderAmount', 'pPrice'];
      moneyIds.forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id !== 'pPrice') {
          el.value = formatPriceTyping(String(s[id] || 0));
        }
        bindPriceInput(el);
      });
      const bank = JSON.parse(localStorage.getItem('ccl_bank_' + session.shopId) || '{}');
      if (bank.name) document.getElementById('bankName').value = bank.name;
      if (bank.acc) document.getElementById('bankAcc').value = bank.acc;
      if (bank.holder) document.getElementById('bankHolder').value = bank.holder;
      bindMediaInputs();
      renderImagesPreview();
      renderVideosPreview();
      renderMyProducts();
      const me = CCLStore.findUserByEmail(session.email);
      if (me) {
        const ph = document.getElementById('sellerPhone');
        const ad = document.getElementById('sellerAddress');
        if (ph) ph.value = me.phone || '';
        if (ad) ad.value = me.address || '';
      }
    }

    function toggleAccept() {
      CCLConfig.saveShopSettings(session.shopId, { acceptOrders: document.getElementById('acceptOrders').checked });
      toast('Đã cập nhật', 'info');
    }
    function savePricing() {
      CCLConfig.saveShopSettings(session.shopId, {
        shipFeeProduct: parseVNDInput(document.getElementById('shipFeeProduct').value),
        freeShipThreshold: parseVNDInput(document.getElementById('freeShipThreshold').value),
        serviceCallOutFee: parseVNDInput(document.getElementById('serviceCallOutFee').value),
        minOrderAmount: parseVNDInput(document.getElementById('minOrderAmount').value),
      });
      toast('Đã lưu phí vận chuyển', 'success');
    }
    function saveBank() {
      localStorage.setItem('ccl_bank_' + session.shopId, JSON.stringify({
        name: document.getElementById('bankName').value.trim(),
        acc: document.getElementById('bankAcc').value.trim(),
        holder: document.getElementById('bankHolder').value.trim(),
      }));
      toast('Đã lưu tài khoản', 'success');
    }

    function renderMyProducts() {
      const list = CCLStore.getProducts().filter((p) =>
        p.shopId === session.shopId || (session.email && p.sellerEmail === session.email)
      );
      const grid = document.getElementById('myProductsGrid');
      if (grid) {
        grid.innerHTML = list.length
          ? list.map((p) => productCard(p)).join('')
          : '<p style="color:var(--text-muted)">Chưa có sản phẩm — đăng ở form phía trên</p>';
      }
      const body = document.getElementById('myProducts');
      if (!body) return;
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="4" style="color:var(--text-muted);text-align:center">Chưa có sản phẩm</td></tr>';
        return;
      }
      body.innerHTML = list.map((p) => `
        <tr>
          <td>${p.name}</td>
          <td>${p.type === 'product' ? 'Sản phẩm' : 'Dịch vụ'}</td>
          <td>${formatVND(p.price)}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Sửa</button>
            <button class="btn btn-ghost btn-sm" onclick="removeProduct('${p.id}')">Ẩn</button>
            <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="cancelProduct('${p.id}')">Hủy SP</button>
          </td>
        </tr>
      `).join('');
    }

    function saveSellerContact() {
      const phone = document.getElementById('sellerPhone').value.trim();
      const address = document.getElementById('sellerAddress').value.trim();
      if (!CCLStore.findUserByEmail(session.email)) {
        CCLStore.createUser({
          name: session.name || session.email,
          email: session.email,
          password: 'seller-' + Date.now(),
          role: 'seller',
          shopName: session.shopName,
          phone,
        });
        CCLStore.updateUser(session.email, { verified: true, address, shopId: session.shopId });
      } else {
        CCLStore.updateUser(session.email, { phone, address });
      }
      CCLStore.setSession({ ...session, phone, address });
      toast('Đã lưu liên hệ', 'success');
    }

    function resetProductForm() {
      document.getElementById('pEditId').value = '';
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pDesc').value = '';
      document.getElementById('pGuide').value = '';
      document.getElementById('pEmoji').value = '';
      const urlEl = document.getElementById('pImageUrl');
      if (urlEl) urlEl.value = '';
      productImages = [];
      productVideos = [];
      renderImagesPreview();
      renderVideosPreview();
    }

    function editProduct(p) {
      document.getElementById('pEditId').value = p.id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pType').value = p.type;
      document.getElementById('pCat').value = p.category || 'khac';
      document.getElementById('pDesc').value = p.description || '';
      document.getElementById('pGuide').value = p.guide || '';
      productImages = Array.isArray(p.images) ? p.images.slice(0, MAX_IMAGES) : [];
      productVideos = Array.isArray(p.videos) ? p.videos.slice(0, MAX_VIDEOS) : [];
      renderImagesPreview();
      renderVideosPreview();
      document.getElementById('pPrice').value = typeof formatPriceTyping === 'function' ? formatPriceTyping(String(p.price || 0)) : (p.price || '');
      document.getElementById('pEmoji').value = p.emoji || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveProductForm() {
      const name = document.getElementById('pName').value.trim();
      const price = (typeof parseVNDInput === 'function' ? parseVNDInput(document.getElementById('pPrice').value) : Number(String(document.getElementById('pPrice').value).replace(/[^\d]/g, '')));
      if (!name || !(price >= 0)) { toast('Nhập tên và giá', 'error'); return; }
      const id = document.getElementById('pEditId').value || undefined;
      CCLStore.saveProduct({
        id,
        shopId: session.shopId,
        shopName: session.shopName || session.name,
        sellerEmail: session.email,
        type: document.getElementById('pType').value,
        name,
        price,
        category: document.getElementById('pCat').value,
        description: document.getElementById('pDesc').value.trim(),
        guide: document.getElementById('pGuide').value.trim(),
        images: productImages.slice(0, MAX_IMAGES),
        videos: productVideos.slice(0, MAX_VIDEOS),
        emoji: document.getElementById('pEmoji').value.trim() || (document.getElementById('pType').value === 'service' ? '🛠️' : '📦'),
        active: true,
      });
      toast('Đã lưu sản phẩm', 'success');
      resetProductForm();
      renderMyProducts();
    }

    function removeProduct(id) {
      if (!confirm('Ẩn sản phẩm khỏi gian hàng?')) return;
      CCLStore.deleteProduct(id, session.email);
      toast('Đã ẩn sản phẩm', 'info');
      renderMyProducts();
    }

    function cancelProduct(id) {
      if (!confirm('Hủy / xóa vĩnh viễn sản phẩm này?')) return;
      if (CCLStore.hardDeleteProduct) CCLStore.hardDeleteProduct(id, session.email);
      else CCLStore.deleteProduct(id, session.email);
      toast('Đã hủy sản phẩm', 'info');
      resetProductForm();
      renderMyProducts();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
