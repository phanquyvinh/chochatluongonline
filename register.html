<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — chochatluongonline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:440px">
      <a href="/" class="logo" style="justify-content:center">
        <div class="logo-mark">CCL</div>
        <div class="logo-text">chochatluong<span>online</span></div>
      </a>
      <h1 id="formTitle">Đăng ký</h1>
      <p class="subtitle" id="formSub">Tạo tài khoản mới</p>

      <div id="stepRegister">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="name" placeholder="Họ và tên" autocomplete="name">
        </div>

        <div class="form-group">
          <label>Phương thức</label>
          <div class="filters" style="margin:0">
            <button type="button" class="chip active" id="tabEmail" onclick="setMethod('email')">Email</button>
            <button type="button" class="chip" id="tabPhone" onclick="setMethod('phone')">Số điện thoại</button>
          </div>
        </div>

        <div class="form-group" id="emailGroup">
          <label>Email</label>
          <input type="email" id="email" placeholder="Email nhận OTP" autocomplete="email">
        </div>
        <div class="form-group" id="phoneGroup" style="display:none">
          <label>Số điện thoại</label>
          <input type="tel" id="phone" placeholder="09x... hoặc +84..." autocomplete="tel">
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Vai trò</label>
          <select id="role" onchange="onRoleChange()">
            <option value="buyer">Người mua</option>
            <option value="seller">Người bán</option>
            <option value="shipper">Đơn vị vận chuyển</option>
          </select>
        </div>
        <div class="form-group" id="shopNameGroup" style="display:none">
          <label>Tên gian hàng</label>
          <input type="text" id="shopName" placeholder="Tên shop">
        </div>
        <button class="btn btn-primary btn-block" id="btnSend" onclick="submitRegister()">Gửi mã OTP</button>
      </div>

      <div id="stepOtp" style="display:none">
        <p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:16px;text-align:center">
          Đã gửi mã tới <strong id="otpTarget"></strong>
        </p>
        <div class="form-group">
          <label>Mã OTP (6 số)</label>
          <input type="text" id="otpCode" maxlength="6" inputmode="numeric" placeholder="••••••"
            style="letter-spacing:6px;text-align:center;font-size:1.2rem" autocomplete="one-time-code">
        </div>
        <button class="btn btn-primary btn-block" id="btnVerify" onclick="submitOtp()">Xác nhận</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" id="btnResend" onclick="resendOtp()">Gửi lại OTP</button>
      </div>

      <p style="text-align:center;margin-top:18px;font-size:0.9rem;color:var(--text-muted)">
        Đã có tài khoản? <a href="/login.html" style="color:var(--primary);font-weight:600">Đăng nhập</a>
      </p>
    </div>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    let otpToken = '';
    let regMethod = 'email';
    let pending = null;

    function setMethod(m) {
      regMethod = m;
      document.getElementById('tabEmail').classList.toggle('active', m === 'email');
      document.getElementById('tabPhone').classList.toggle('active', m === 'phone');
      document.getElementById('emailGroup').style.display = m === 'email' ? 'block' : 'none';
      document.getElementById('phoneGroup').style.display = m === 'phone' ? 'block' : 'none';
    }

    function onRoleChange() {
      document.getElementById('shopNameGroup').style.display =
        document.getElementById('role').value === 'seller' ? 'block' : 'none';
    }

    function collectForm() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const shopName = document.getElementById('shopName').value.trim();
      return { name, email, phone, password, role, shopName };
    }

    function validateForm(f) {
      if (!f.name || !f.password) { toast('Điền họ tên và mật khẩu', 'error'); return false; }
      if (f.password.length < 6) { toast('Mật khẩu tối thiểu 6 ký tự', 'error'); return false; }
      if (f.role === 'seller' && !f.shopName) { toast('Nhập tên gian hàng', 'error'); return false; }
      if (regMethod === 'email') {
        if (!f.email || !f.email.includes('@')) { toast('Nhập email hợp lệ', 'error'); return false; }
        if (CCLStore.findUserByEmail(f.email)) { toast('Email đã được đăng ký', 'error'); return false; }
      } else {
        const digits = f.phone.replace(/\D/g, '');
        if (digits.length < 9) { toast('Số điện thoại không hợp lệ', 'error'); return false; }
        if (CCLStore.findUserByPhone && CCLStore.findUserByPhone(f.phone)) {
          toast('Số điện thoại đã được đăng ký', 'error');
          return false;
        }
      }
      return true;
    }

    function showOtpStep(targetLabel) {
      document.getElementById('stepRegister').style.display = 'none';
      document.getElementById('stepOtp').style.display = 'block';
      document.getElementById('otpTarget').textContent = targetLabel;
      document.getElementById('formTitle').textContent = 'Xác nhận OTP';
      document.getElementById('formSub').textContent = regMethod === 'phone'
        ? 'Nhập mã OTP đã gửi tới số điện thoại'
        : 'Nhập mã OTP đã gửi về email';
    }

    async function sendEmailOtp(f) {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'register_otp',
          name: f.name,
          email: f.email,
          phone: f.phone || '',
          password: f.password,
          role: f.role,
          shopName: f.shopName,
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || 'Không gửi được OTP');
      otpToken = data.otpToken;
      pending = { ...f, channel: 'email' };
      showOtpStep(f.email);
      toast('Đã gửi mã OTP tới email', 'success');
    }

    function sendPhoneOtp(f) {
      const key = CCLStore.normalizePhone(f.phone);
      const code = CCLStore.setOtp(key, 'register');
      otpToken = 'phone:' + key;
      pending = { ...f, channel: 'phone', phoneKey: key, localCode: code };
      showOtpStep(f.phone);
      // Môi trường chưa cấu hình SMS gateway: mã OTP hiển thị một lần để hoàn tất đăng ký
      toast('Mã OTP: ' + code, 'info');
    }

    async function submitRegister() {
      const f = collectForm();
      if (!validateForm(f)) return;

      const btn = document.getElementById('btnSend');
      btn.disabled = true;
      btn.textContent = 'Đang gửi...';

      try {
        if (regMethod === 'email') {
          await sendEmailOtp(f);
        } else {
          sendPhoneOtp(f);
        }
      } catch (e) {
        toast(e.message || 'Không gửi được OTP', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Gửi mã OTP';
      }
    }

    function finishLocalRegister(f) {
      const created = CCLStore.createUser({
        name: f.name,
        email: f.channel === 'email' ? f.email : '',
        phone: f.phone || '',
        password: f.password,
        role: f.role,
        shopName: f.shopName,
        verified: true,
      });
      if (created.error) {
        toast(created.error, 'error');
        return false;
      }
      const u = created.user;
      CCLStore.setSession({
        email: u.email || '',
        name: u.name,
        role: u.role,
        shopId: u.shopId,
        shopName: u.shopName,
        phone: u.phone,
        id: u.id,
      });
      return true;
    }

    async function submitOtp() {
      const code = document.getElementById('otpCode').value.trim();
      if (!code || code.length < 6) { toast('Nhập đủ 6 số OTP', 'error'); return; }
      if (!pending || !otpToken) { toast('Phiên OTP không hợp lệ', 'error'); return; }

      const btn = document.getElementById('btnVerify');
      btn.disabled = true;
      btn.textContent = 'Đang xác nhận...';

      try {
        if (pending.channel === 'phone') {
          const result = CCLStore.verifyOtp(pending.phoneKey, code);
          const ok = result === true || (result && result.ok);
          if (!ok) {
            toast((result && result.message) || 'OTP không đúng hoặc đã hết hạn', 'error');
            return;
          }
          if (!finishLocalRegister(pending)) return;
          toast('Đăng ký thành công', 'success');
          setTimeout(() => {
            if (pending.role === 'seller') location.href = '/seller.html';
            else location.href = '/';
          }, 500);
          return;
        }

        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'verify_otp', otpToken, code }),
        });
        const data = await res.json();
        if (!data.success) {
          toast(data.message || 'OTP không đúng', 'error');
          return;
        }

        const u = data.user;
        const existing = CCLStore.findUserByEmail(u.email);
        if (!existing) {
          const created = CCLStore.createUser({
            name: u.name,
            email: u.email,
            password: u.password || pending.password,
            role: u.role || pending.role,
            shopName: u.shopName || pending.shopName,
            phone: u.phone || pending.phone || '',
            verified: true,
          });
          if (created.error) { toast(created.error, 'error'); return; }
          if (created.user) {
            CCLStore.updateUser(created.user.email || created.user.id, {
              verified: true,
              shopId: created.user.shopId,
              shopName: created.user.shopName || u.shopName,
            });
          }
        } else {
          CCLStore.updateUser(u.email, {
            verified: true,
            password: u.password || pending.password,
            name: u.name,
            phone: u.phone || pending.phone || existing.phone,
          });
        }

        const local = CCLStore.findUserByEmail(u.email);
        CCLStore.setSession(local || {
          email: u.email,
          name: u.name,
          role: u.role,
          shopId: local?.shopId,
          shopName: u.shopName,
          phone: u.phone || pending.phone,
        });
        if (data.token) localStorage.setItem('vq_token', data.token);

        toast('Đăng ký thành công', 'success');
        setTimeout(() => {
          const role = (local && local.role) || u.role || pending.role;
          if (role === 'seller') location.href = '/seller.html';
          else location.href = '/';
        }, 500);
      } catch (e) {
        toast('Lỗi kết nối máy chủ', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Xác nhận';
      }
    }

    async function resendOtp() {
      if (!pending) { toast('Phiên không hợp lệ', 'error'); return; }
      try {
        if (pending.channel === 'phone') {
          sendPhoneOtp(pending);
        } else {
          await sendEmailOtp(pending);
        }
      } catch (e) {
        toast(e.message || 'Không gửi lại được OTP', 'error');
      }
    }
  </script>
</body>
</html>
