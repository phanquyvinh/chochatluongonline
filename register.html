<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — chochatluongonline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:440px">
      <a href="/" class="logo" style="justify-content:center">
        <div class="logo-mark">CCL</div>
        <div class="logo-text">chochatluong<span>online</span></div>
      </a>
      <h1 id="formTitle">Đăng ký</h1>
      <p class="subtitle" id="formSub">Tạo tài khoản mới</p>

      <div id="stepRegister">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="name" placeholder="Họ và tên" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Email nhận OTP" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="tel" id="phone" placeholder="09x..." autocomplete="tel">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Vai trò</label>
          <select id="role" onchange="onRoleChange()">
            <option value="buyer">Người mua</option>
            <option value="seller">Người bán</option>
            <option value="shipper">Đơn vị vận chuyển</option>
          </select>
        </div>
        <div class="form-group" id="shopNameGroup" style="display:none">
          <label>Tên gian hàng</label>
          <input type="text" id="shopName" placeholder="Tên shop">
        </div>
        <button class="btn btn-primary btn-block" id="btnSend" onclick="submitRegister()">Gửi mã OTP</button>
      </div>

      <div id="stepOtp" style="display:none">
        <p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:16px;text-align:center">
          Đã gửi mã tới <strong id="otpEmail"></strong>. Kiểm tra hộp thư (và mục Spam).
        </p>
        <div class="form-group">
          <label>Mã OTP (6 số)</label>
          <input type="text" id="otpCode" maxlength="6" inputmode="numeric" placeholder="••••••"
            style="letter-spacing:6px;text-align:center;font-size:1.2rem" autocomplete="one-time-code">
        </div>
        <button class="btn btn-primary btn-block" id="btnVerify" onclick="submitOtp()">Xác nhận</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" id="btnResend" onclick="resendOtp()">Gửi lại OTP</button>
      </div>

      <p style="text-align:center;margin-top:18px;font-size:0.9rem;color:var(--text-muted)">
        Đã có tài khoản? <a href="/login.html" style="color:var(--primary);font-weight:600">Đăng nhập</a>
      </p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    let otpToken = '';

    function onRoleChange() {
      document.getElementById('shopNameGroup').style.display =
        document.getElementById('role').value === 'seller' ? 'block' : 'none';
    }

    async function submitRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const shopName = document.getElementById('shopName').value.trim();

      if (!name || !email || !password) { toast('Điền đầy đủ thông tin', 'error'); return; }
      if (password.length < 6) { toast('Mật khẩu tối thiểu 6 ký tự', 'error'); return; }
      if (role === 'seller' && !shopName) { toast('Nhập tên gian hàng', 'error'); return; }

      const btn = document.getElementById('btnSend');
      btn.disabled = true;
      btn.textContent = 'Đang gửi...';

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'register_otp',
            name, email, phone, password, role, shopName,
          }),
        });
        const data = await res.json();
        if (!data.success) {
          toast(data.message || 'Không gửi được OTP', 'error');
          return;
        }
        otpToken = data.otpToken;
        document.getElementById('stepRegister').style.display = 'none';
        document.getElementById('stepOtp').style.display = 'block';
        document.getElementById('otpEmail').textContent = email;
        document.getElementById('formTitle').textContent = 'Xác nhận email';
        document.getElementById('formSub').textContent = 'Nhập OTP đã gửi về hộp thư';
        toast('Đã gửi mã OTP tới email', 'success');
      } catch (e) {
        toast('Lỗi kết nối máy chủ', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Gửi mã OTP';
      }
    }

    async function submitOtp() {
      const code = document.getElementById('otpCode').value.trim();
      if (!code || code.length < 6) { toast('Nhập đủ 6 số OTP', 'error'); return; }
      if (!otpToken) { toast('Phiên OTP không hợp lệ', 'error'); return; }

      const btn = document.getElementById('btnVerify');
      btn.disabled = true;
      btn.textContent = 'Đang xác nhận...';

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'verify_otp', otpToken, code }),
        });
        const data = await res.json();
        if (!data.success) {
          toast(data.message || 'OTP không đúng', 'error');
          return;
        }

        // Lưu user local + session
        const u = data.user;
        const existing = CCLStore.findUserByEmail(u.email);
        if (!existing) {
          const created = CCLStore.createUser({
            name: u.name,
            email: u.email,
            password: u.password,
            role: u.role,
            shopName: u.shopName,
            phone: u.phone,
          });
          if (created.user) {
            CCLStore.updateUser(u.email, {
              verified: true,
              shopId: created.user.shopId,
              shopName: created.user.shopName || u.shopName,
            });
          }
        } else {
          CCLStore.updateUser(u.email, { verified: true, password: u.password, name: u.name });
        }

        const local = CCLStore.findUserByEmail(u.email);
        CCLStore.setSession(local || {
          email: u.email, name: u.name, role: u.role,
          shopId: local?.shopId, shopName: u.shopName,
        });
        if (data.token) localStorage.setItem('vq_token', data.token);

        toast('Kích hoạt thành công', 'success');
        setTimeout(() => {
          if (u.role === 'seller') location.href = '/seller.html';
          else location.href = '/';
        }, 500);
      } catch (e) {
        toast('Lỗi kết nối', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Xác nhận';
      }
    }

    async function resendOtp() {
      if (!otpToken) return;
      const btn = document.getElementById('btnResend');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'resend_otp', otpToken }),
        });
        const data = await res.json();
        if (!data.success) {
          toast(data.message || 'Không gửi lại được', 'error');
          return;
        }
        otpToken = data.otpToken;
        toast('Đã gửi lại OTP — kiểm tra email', 'success');
      } catch {
        toast('Lỗi kết nối', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('otpCode')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitOtp();
    });
  </script>
</body>
</html>
