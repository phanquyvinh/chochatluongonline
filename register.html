<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — chochatluongonline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:440px">
      <a href="/" class="logo" style="justify-content:center">
        <div class="logo-mark">CCL</div>
        <div class="logo-text">chochatluong<span>online</span></div>
      </a>
      <h1 id="formTitle">Đăng ký</h1>
      <p class="subtitle" id="formSub">Tạo tài khoản mới</p>

      <div id="stepRegister">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="name" placeholder="Họ và tên">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Email nhận OTP">
        </div>
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="tel" id="phone" placeholder="09x...">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Tối thiểu 6 ký tự">
        </div>
        <div class="form-group">
          <label>Vai trò</label>
          <select id="role" onchange="onRoleChange()">
            <option value="buyer">Người mua</option>
            <option value="seller">Người bán</option>
            <option value="shipper">Đơn vị vận chuyển</option>
          </select>
        </div>
        <div class="form-group" id="shopNameGroup" style="display:none">
          <label>Tên gian hàng</label>
          <input type="text" id="shopName" placeholder="Tên shop">
        </div>
        <button class="btn btn-primary btn-block" onclick="submitRegister()">Gửi mã OTP</button>
      </div>

      <div id="stepOtp" style="display:none">
        <p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:16px;text-align:center">
          Nhập mã OTP đã gửi tới <strong id="otpEmail"></strong>
        </p>
        <div class="form-group">
          <label>Mã OTP (6 số)</label>
          <input type="text" id="otpCode" maxlength="6" inputmode="numeric" placeholder="••••••" style="letter-spacing:6px;text-align:center;font-size:1.2rem">
        </div>
        <button class="btn btn-primary btn-block" onclick="submitOtp()">Xác nhận</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="resendOtp()">Gửi lại OTP</button>
      </div>

      <p style="text-align:center;margin-top:18px;font-size:0.9rem;color:var(--text-muted)">
        Đã có tài khoản? <a href="/login.html" style="color:var(--primary);font-weight:600">Đăng nhập</a>
      </p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    let pendingEmail = '';
    let lastOtpDev = null; // only used to call email API; never shown as "demo hint" on page permanently

    function onRoleChange() {
      document.getElementById('shopNameGroup').style.display =
        document.getElementById('role').value === 'seller' ? 'block' : 'none';
    }

    function submitRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const shopName = document.getElementById('shopName').value.trim();
      if (!name || !email || !password) { toast('Điền đầy đủ thông tin', 'error'); return; }
      if (password.length < 6) { toast('Mật khẩu tối thiểu 6 ký tự', 'error'); return; }
      if (role === 'seller' && !shopName) { toast('Nhập tên gian hàng', 'error'); return; }
      if (CCLStore.findUserByEmail(email)) { toast('Email đã được đăng ký', 'error'); return; }

      const result = CCLStore.createUser({ name, email, phone, password, role, shopName });
      if (result.error) { toast(result.error, 'error'); return; }

      const code = CCLStore.setOtp(email, 'register');
      pendingEmail = email;
      lastOtpDev = code;

      // Try server email; if unavailable, OTP still validates locally
      fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'send_otp', email, code, purpose: 'register' }),
      }).catch(() => {});

      document.getElementById('stepRegister').style.display = 'none';
      document.getElementById('stepOtp').style.display = 'block';
      document.getElementById('otpEmail').textContent = email;
      document.getElementById('formTitle').textContent = 'Xác nhận email';
      document.getElementById('formSub').textContent = 'Nhập OTP để kích hoạt tài khoản';
      toast('Đã gửi mã OTP tới email', 'success');
    }

    function submitOtp() {
      const code = document.getElementById('otpCode').value.trim();
      const v = CCLStore.verifyOtp(pendingEmail, code);
      if (!v.ok) { toast(v.message, 'error'); return; }
      CCLStore.updateUser(pendingEmail, { verified: true });
      const user = CCLStore.findUserByEmail(pendingEmail);
      CCLStore.setSession(user);
      toast('Xác nhận thành công', 'success');
      setTimeout(() => {
        if (user.role === 'seller') location.href = '/seller.html';
        else location.href = '/';
      }, 500);
    }

    function resendOtp() {
      if (!pendingEmail) return;
      const code = CCLStore.setOtp(pendingEmail, 'register');
      lastOtpDev = code;
      fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'send_otp', email: pendingEmail, code, purpose: 'register' }),
      }).catch(() => {});
      toast('Đã gửi lại OTP', 'info');
    }
  </script>
</body>
</html>
