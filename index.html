<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chochatluongonline</title>
  <meta name="description" content="chochatluongonline — Phan Quý Vinh">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .empty-msg { color: var(--text-muted); grid-column: 1/-1; padding: 20px 0; }
    .card-img img { border-radius: 0; }
    a.card-img, a.card-title, a.card-shop { text-decoration: none; color: inherit; }
    a.card-title:hover { color: var(--primary); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <div class="logo-mark">CCL</div>
        <div class="logo-text">chochatluong<span>online</span></div>
      </a>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="Tìm sản phẩm, dịch vụ, shop..." data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      </div>
      <div class="header-actions">
        <a href="#cart" class="btn btn-ghost btn-icon cart-btn">🛒
          <span class="badge-count" data-cart-count style="display:none">0</span>
        </a>
        <select id="langSelect" class="lang-select" onchange="setLang(this.value)" aria-label="Language">
          <option value="vi">VI</option>
          <option value="en">EN</option>
        </select>
        <div id="userNav"></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px">
    <div class="mobile-search">
      <div class="search-wrap" style="display:flex;width:100%;max-width:none">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInputMobile" placeholder="Tìm sản phẩm, dịch vụ, shop..." autocomplete="off">
      </div>
    </div>
    <section class="section">
      <div class="section-header">
        <h2 class="section-title"><span class="icon"">📦</span> <span data-i18n="products">Sản phẩm</span></h2>
        <div class="filters">
          <button class="chip active" data-filter="all" onclick="setFilter('all')" data-i18n="all">Tất cả</button>
          <button class="chip" data-filter="product" onclick="setFilter('product')" data-i18n="products">Sản phẩm</button>
          <button class="chip" data-filter="service" onclick="setFilter('service')" data-i18n="services">Dịch vụ</button>
          <button class="chip" data-filter="linh-kien" onclick="setFilter('linh-kien')" data-i18n="parts">Linh kiện</button>
          <button class="chip" data-filter="sua-chua" onclick="setFilter('sua-chua')" data-i18n="repair">Sửa chữa</button>
          <button class="chip" data-filter="lap-dat" onclick="setFilter('lap-dat')" data-i18n="install">Lắp đặt</button>
        </div>
      </div>
      <div class="filter-bar">
        <input type="number" id="filterMinPrice" placeholder="Giá từ" data-i18n-placeholder="priceFrom" min="0" step="10000" style="width:110px">
        <input type="number" id="filterMaxPrice" placeholder="Giá đến" data-i18n-placeholder="priceTo" min="0" step="10000" style="width:110px">
        <select id="filterMinRating" class="sort-select">
          <option value="0" data-i18n-option="anyRating">Mọi đánh giá</option>
          <option value="3">Từ 3★</option>
          <option value="4">Từ 4★</option>
          <option value="4.5">Từ 4.5★</option>
        </select>
        <select id="filterSort" class="sort-select">
          <option value="default" data-i18n-option="sortDefault">Phù hợp nhất</option>
          <option value="price_asc" data-i18n-option="sortPriceAsc">Giá thấp → cao</option>
          <option value="price_desc" data-i18n-option="sortPriceDesc">Giá cao → thấp</option>
          <option value="rating" data-i18n-option="sortRating">Đánh giá cao</option>
          <option value="sold" data-i18n-option="sortSold">Bán chạy</option>
          <option value="newest" data-i18n-option="sortNewest">Mới nhất</option>
        </select>
        <span id="resultCount" style="font-size:0.85rem;color:var(--text-muted)"></span>
      </div>
      <div class="grid" id="productsGrid"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2 class="section-title"><span class="icon"">🛠️</span> <span data-i18n="services">Dịch vụ</span></h2>
      </div>
      <div class="grid" id="servicesGrid"></div>
    </section>

    <section class="section" id="cart">
      <div class="section-header">
        <h2 class="section-title"><span class="icon"">🛍️</span> <span data-i18n="cart">Giỏ hàng</span></h2>
      </div>
      <div class="cart-section">
        <div id="cartContainer"></div>
        <div id="cartSummary" style="display:none">
          <div class="cart-summary">
            <div class="summary-row"><span data-i18n="subtotal">Tạm tính</span><span id="sumItems">0 đ</span></div>
            <div class="summary-row"><span data-i18n="shipping">Vận chuyển</span><span id="sumShip">0 đ</span></div>
            <div class="summary-row" id="sumDiscountRow" style="display:none;color:var(--success)"><span data-i18n="discount">Giảm giá</span><span id="sumDiscount">0 đ</span></div>
            <div class="summary-row" style="font-size:0.85rem;color:var(--text-muted)"><span id="sumFeeNote"></span><span></span></div>
            <div class="summary-row total"><span data-i18n="total">Tổng</span><span id="sumTotal">0 đ</span></div>
          </div>
          <div class="checkout-row">
            <div class="form-field">
              <label data-i18n="voucher">Mã giảm</label>
              <div style="display:flex;gap:8px">
                <input type="text" id="voucherInput" placeholder="Nhập mã" style="min-width:120px">
                <button type="button" class="btn btn-outline btn-sm" onclick="applyVoucher()" data-i18n="apply">Áp dụng</button>
              </div>
            </div>
            <div class="form-field">
              <label data-i18n="bank">Ngân hàng</label>
              <select id="bankSelect">
                <option>Vietcombank</option>
                <option>Techcombank</option>
                <option>MB Bank</option>
                <option>VPBank</option>
                <option>BIDV</option>
              </select>
            </div>
            <button class="btn btn-accent" id="checkoutBtn" onclick="checkoutOrder()" data-i18n="checkout">Thanh toán</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border:0;margin:0;padding:0;justify-content:space-between">
      <span>© chochatluongonline</span>
      <span>Hotline 0975 898 828</span>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initHome);</script>
</body>
</html>
